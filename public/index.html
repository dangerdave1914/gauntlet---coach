<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08182E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gauntlet Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08182E; --card:#0F2743; --line:#1D3D63;
  --white:#fff; --chalk:#A9BFD8; --blue:#3D8BFF; --warn:#F2B441;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--white);
  font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45;
  display:flex;flex-direction:column;overscroll-behavior:none;
}
h1,h2,h3,.cond{font-family:'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}

/* ---- header ---- */
header{padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 0;flex:none}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand h1{font-size:22px;font-weight:700}
.stamp{font-size:11px;color:var(--chalk);text-align:right;line-height:1.3}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{
  flex:none;border:1px solid var(--line);background:transparent;color:var(--chalk);
  border-radius:999px;padding:7px 15px;font:600 14px/1 'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.06em;cursor:pointer;
}
.day[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
.day.today::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--blue);margin:4px auto -8px}

/* ---- panes ---- */
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{
  flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--chalk);
  padding:11px 0;font:600 14px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.08em;cursor:pointer;
}
.tab[aria-selected="true"]{color:var(--white);border-bottom-color:var(--blue)}
main{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
section{flex:none;width:100%;scroll-snap-align:start;overflow-y:auto;padding:14px var(--pad) 90px}

/* ---- tier switch ---- */
.tier{display:flex;gap:6px;margin-bottom:14px}
.tier button{
  flex:1;border:1px solid var(--line);background:transparent;color:var(--chalk);border-radius:8px;
  padding:9px;font:600 14px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;
}
.tier button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--white)}
.tier button.black[aria-pressed="true"]{background:var(--white);border-color:var(--white);color:var(--ink)}

/* ---- towers ---- */
.tower{border-top:1px solid var(--line);padding:14px 0}
.tower:first-of-type{border-top:0;padding-top:0}
.tower h2{font-size:15px;color:var(--chalk);font-weight:600;margin-bottom:8px}
.combo{display:flex;flex-wrap:wrap;gap:6px 7px}
.tok{
  font:600 20px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.02em;
  border:0;background:none;color:var(--white);padding:2px 0;cursor:default;
}
.tok.known{cursor:pointer;border-bottom:2px solid var(--blue)}
.tok.known:active{color:var(--blue)}
.brk{flex-basis:100%;height:0}
.gloss{
  grid-column:1/-1;flex-basis:100%;margin-top:6px;padding:8px 11px;border-left:2px solid var(--blue);
  background:rgba(61,139,255,.1);font-size:14px;color:var(--white);border-radius:0 6px 6px 0;
}
.gloss.linked{cursor:pointer;border-left-color:var(--blue);background:rgba(61,139,255,.16)}
.gloss.linked:active{background:rgba(61,139,255,.26)}
.gloss .watch{
  display:inline-flex;align-items:center;gap:4px;margin-left:8px;color:var(--blue);
  font:600 12px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;
  white-space:nowrap;
}
.empty{color:var(--chalk);font-size:14px;font-style:italic}

/* ---- workout ---- */
.wk{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--card)}
.wk h2{font-size:19px;margin-bottom:2px}
.focus{color:var(--blue);font-size:13px;font-weight:600;margin-bottom:12px}
.row{border-top:1px solid var(--line);padding:11px 0}
.row:first-of-type{border-top:0;padding-top:0}
.row h3{font-size:12px;color:var(--chalk);letter-spacing:.1em;margin-bottom:4px}
.row p{margin:0;font-size:15px;white-space:pre-wrap}
.badge{
  display:inline-flex;align-items:center;gap:6px;font:600 12px/1 'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.09em;padding:6px 10px;border-radius:999px;margin-bottom:12px;
}
.badge.ok{background:rgba(61,139,255,.16);color:var(--blue)}
.badge.no{background:rgba(242,180,65,.16);color:var(--warn)}
.note{border-left:2px solid var(--warn);background:rgba(242,180,65,.08);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px}

/* ---- announcements ---- */
.banner{
  border-left:3px solid var(--blue);background:rgba(61,139,255,.12);
  padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:14px;
}
.banner h3{font-size:15px;margin-bottom:2px}
.banner p{margin:0;font-size:14px;color:var(--chalk)}
.banner .more{display:inline-block;margin-top:6px;font-size:12px;color:var(--blue);cursor:pointer}
.news{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px;margin-bottom:10px}
.news h3{font-size:17px;margin-bottom:3px}
.news .meta{font-size:11px;color:var(--chalk);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.news p{margin:0;font-size:15px;white-space:pre-wrap}
textarea{
  width:100%;min-height:96px;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--white);font:inherit;font-size:15px;resize:vertical;margin:10px 0;
}
input[type=text],input[type=date]{
  width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--white);font-size:15px;margin:10px 0;
}
.ok{color:var(--blue);font-size:14px}

/* ---- schedule ---- */
.datenav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.datenav button{
  border:1px solid var(--line);background:var(--card);color:var(--white);border-radius:9px;
  width:40px;height:38px;font-size:17px;cursor:pointer;flex:none;
}
.datenav .label{flex:1;text-align:center;font:600 17px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em}
.slot{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin-bottom:9px}
.slot.open{border-color:var(--warn)}
.slot .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slot .when{font:600 17px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.slot .cls{font-size:13px;color:var(--blue);font-weight:600}
.slot .who{margin-top:6px;font-size:15px}
.slot .who.none{color:var(--chalk);font-style:italic}
.slot .acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.slot .acts button{
  border:1px solid var(--line);background:transparent;color:var(--white);border-radius:8px;
  padding:8px 13px;font:600 12px 'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.07em;cursor:pointer;
}
.slot .acts button.take{background:var(--warn);border-color:var(--warn);color:#1a1200}
.ask{margin-top:8px;padding:8px 11px;border-left:2px solid var(--warn);background:rgba(242,180,65,.1);
  border-radius:0 6px 6px 0;font-size:13px}
.pick{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.pick button{
  border:1px solid var(--line);background:var(--card);color:var(--white);border-radius:999px;
  padding:9px 15px;font-size:14px;cursor:pointer;
}
.pick button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}

.slot.closed{opacity:.55}
.slot.closed .who{text-decoration:line-through}
.evt{border:1px solid var(--blue);background:rgba(61,139,255,.09);border-radius:12px;padding:12px;margin-bottom:9px}
.evt .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.evt h3{font-size:17px}
.evt .meta{font-size:13px;color:var(--chalk);margin-top:4px}
.evt.meeting{border-color:var(--line);background:var(--card)}
.tagline{font:600 11px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--blue)}

.slot.off{opacity:.55}
.slot.off .when{text-decoration:line-through}
.slot .flag{display:inline-block;margin-top:6px;font:600 11px 'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.09em;padding:4px 8px;border-radius:999px}
.slot .flag.off{background:rgba(255,255,255,.1);color:var(--chalk)}
.slot .flag.pop{background:rgba(61,139,255,.18);color:var(--blue)}
.evt{border:1px solid var(--blue);background:rgba(61,139,255,.08);border-radius:12px;padding:12px;margin-bottom:9px}
.evt h3{font-size:17px;margin-bottom:3px}
.evt .meta{font-size:12px;color:var(--chalk);margin-bottom:5px}
.evt p{margin:0;font-size:14px}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow button{flex:1;padding:12px 6px;border-radius:10px;border:1px dashed var(--line);
  background:transparent;color:var(--chalk);font:600 12px 'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.07em;cursor:pointer}

.viewtog{display:flex;gap:6px;margin-bottom:12px}
.viewtog button{flex:1;border:1px solid var(--line);background:transparent;color:var(--chalk);
  border-radius:8px;padding:8px;font:600 13px 'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.09em;cursor:pointer}
.viewtog button[aria-pressed="true"]{background:var(--white);border-color:var(--white);color:var(--ink)}
.wk-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
.wk-grid{display:grid;min-width:760px;border-top:1px solid var(--line)}
.wk-head{
  position:sticky;top:0;z-index:2;background:var(--ink);border-bottom:1px solid var(--line);
  padding:8px 4px;text-align:center;font:600 12px/1.3 'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.07em;color:var(--chalk);
}
.wk-head.today{color:var(--blue)}
.wk-head b{display:block;font-size:15px;color:inherit}
.wk-time{
  padding:8px 8px 8px 0;text-align:right;font-size:11px;color:var(--chalk);
  border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.wk-cell{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;min-height:44px}
.wk-cell.today{background:rgba(61,139,255,.05)}
.wk-card{
  background:rgba(61,139,255,.16);border-left:3px solid var(--blue);border-radius:0 6px 6px 0;
  padding:6px 7px;height:100%;
}
.wk-card .n{display:block;font-size:13px;font-weight:600;line-height:1.25}
.wk-card .c{display:block;font-size:11px;color:var(--chalk);margin-top:1px}
.wk-card.off{opacity:.45;background:rgba(255,255,255,.06);border-left-color:var(--chalk)}
.wk-card.off .n{text-decoration:line-through}
.wk-card.evt{background:rgba(242,180,65,.16);border-left-color:var(--warn)}
.wk-card.ask{border-left-color:var(--warn)}
.wk-card .tag{display:block;font-size:10px;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.hint{color:var(--chalk);font-size:12px;margin-top:12px;text-align:center}

/* ---- bottom bar ---- */
footer{
  position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;
  padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(to top,var(--ink) 72%,transparent);
}
footer button{
  flex:1;border:1px solid var(--line);background:var(--card);color:var(--white);border-radius:10px;
  padding:12px 6px;font:600 13px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;
}
footer button.primary{background:var(--blue);border-color:var(--blue)}

/* ---- confirm sheet ---- */
dialog{
  border:0;padding:0;background:var(--ink);color:var(--white);width:100%;max-width:560px;
  border-radius:14px;margin:auto;
}
dialog::backdrop{background:rgba(4,10,20,.7)}
.sheet{padding:18px var(--pad) var(--pad)}
.sheet h2{font-size:20px;margin-bottom:4px}
.sub{color:var(--chalk);font-size:14px;margin-bottom:14px}
.rev{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}
.rev.bad{border-color:var(--warn)}
.rev h4{margin:0 0 4px;font:600 14px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em}
.rev p{margin:0;font-size:13px;color:var(--chalk);white-space:pre-wrap}
input[type=email]{
  width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--white);font-size:15px;margin:10px 0;
}
.err{color:var(--warn);font-size:13px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Gauntlet Coach</h1>
    <div class="stamp" id="stamp"></div>
  </div>
  <div class="days" id="days" role="group" aria-label="Day of week"></div>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-pane="0">Combos</button>
  <button class="tab" role="tab" aria-selected="false" data-pane="1">Workout</button>
  <button class="tab" role="tab" aria-selected="false" data-pane="2">Schedule</button>
  <button class="tab" role="tab" aria-selected="false" data-pane="3">News</button>
</div>

<main id="main">
  <section id="pane-combos">
    <div class="tier" role="group" aria-label="Tier">
      <button id="t-blue" aria-pressed="true">Blue</button>
      <button id="t-black" class="black" aria-pressed="false">Black</button>
    </div>
    <div id="towers"></div>
  </section>
  <section id="pane-workout"></section>
  <section id="pane-schedule"></section>
  <section id="pane-news"></section>
</main>

<footer>
  <button id="btn-repair">Coach note</button>
  <button id="btn-post" hidden>Post news</button>
  <button id="btn-confirm" class="primary" hidden>Confirm week</button>
</footer>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

<script>
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const state = { day: DAYS[new Date().getDay()], tier: 'BLUE', data: null };
const $ = s => document.querySelector(s);

/**
 * Notation code -> reference clip, pulled from the Notation Key tab's
 * hyperlinked "meaning" cells. Keyed by the code itself (normalized), not
 * the meaning text, since that's what a token's rendered label matches.
 * Same clip on both sides of a pair unless the sheet links them separately
 * (Cross, Side Kick, and the Spinning Back moves each go their own way).
 */
const VIDEO = {
  'LJ':'https://youtu.be/71nmi6nGcrY','RJ':'https://youtu.be/71nmi6nGcrY',
  'LC':'https://youtu.be/hzxPtUkEbdw','RC':'https://youtu.be/sK-6Ujp3KYY',
  'LH':'https://youtu.be/i3G3HsI1GGU','RH':'https://youtu.be/i3G3HsI1GGU',
  'LU':'https://youtu.be/vXVG82CN_Jo','RU':'https://youtu.be/eBxn21FtqPg',
  'L/SLIP':'https://youtu.be/-cfSa-gBxtc','R/SLIP':'https://youtu.be/-cfSa-gBxtc',
  'DUCK':'https://youtu.be/u3PiuZZmZzA','PULL':'https://youtu.be/7Pli4dauWSE',
  'PIVOT':'https://youtu.be/hNclexRmDsY','TRAP':'https://youtu.be/perx1VSnLA8',
  'POST':'https://youtu.be/Ycs6-P17d28','ROLL RIGHT':'https://youtu.be/mLKrcE0mo4E',
  'ROLL LEFT':'https://youtu.be/mLKrcE0mo4E','CLINCH':'https://youtube.com/shorts/4Vxqg1E0tAM',
  'L/BLOCK':'https://youtu.be/_wlSoYWIrbI','R/BLOCK':'https://youtu.be/_wlSoYWIrbI',
  'CHECK L':'https://youtu.be/onf6qfSOxB8','CHECK R':'https://youtu.be/onf6qfSOxB8',
  'SKIP KNEES':'https://youtu.be/GRfxz5NZSI0',
  'L/FRONTKICK':'https://youtu.be/_oZ9_3FFnZs','R/FRONTKICK':'https://youtu.be/_oZ9_3FFnZs',
  'L/SIDEKICK':'https://youtu.be/98boTtEjgfw','R/SIDEKICK':'https://youtu.be/OkLSVs0jNu8',
  'L/ROUNDKICK':'https://youtu.be/-iKFiHNpOGw','R/ROUNDKICK':'https://youtu.be/BBSV6f2JNEA',
  'L/SWITCH KNEE':'https://youtu.be/_bAdNHstI0g','R/SWITCH KNEE':'https://youtu.be/_bAdNHstI0g',
  'L/KNEE':'https://youtu.be/2vpU5jkpGQs','R/KNEE':'https://youtu.be/2vpU5jkpGQs',
  'L/SLASH':'https://youtu.be/7yKXDJX5778','R/SLASH':'https://youtu.be/7yKXDJX5778',
  'L/UP ELBOW':'https://youtube.com/shorts/Iw20vy4x2qY','R/UP ELBOW':'https://youtube.com/shorts/Iw20vy4x2qY',
  'L/BODY JAB':'https://youtube.com/shorts/Wslu8Hn3ni4','R/BODY JAB':'https://youtube.com/shorts/Wslu8Hn3ni4',
  'OVERHAND LC':'https://youtu.be/oFzdYw3fHbA','OVERHAND RC':'https://youtu.be/oFzdYw3fHbA',
  'SHOVEL LH':'https://youtu.be/PKnACIj2ywQ','SHOVEL RH':'https://youtu.be/PKnACIj2ywQ',
  'L/TOMAHAWK':'https://youtu.be/Dc79wGZhFo0','R/TOMAHAWK':'https://youtu.be/Dc79wGZhFo0',
  'L/SPINNING BACK FIST':'https://youtu.be/7Vn2NycQDJw','R/SPINNING BACK FIST':'https://youtu.be/TUu4m_ouu9Y',
  'L/SPINNING BACK ELBOW':'https://youtu.be/wjrxwXZzKaU','R/SPINNING BACK ELBOW':'https://youtu.be/2Z1wLM4wsXE',
  'L/COLLAR TIE':'https://youtu.be/TrU9NVUGzFo','R/COLLAR TIE':'https://youtu.be/TrU9NVUGzFo',
  'L/POST':'https://youtu.be/Ycs6-P17d28','R/POST':'https://youtu.be/Ycs6-P17d28',
  'FEINT':'https://youtube.com/shorts/sxwzChrbFYc',
  'L/HIP-FEINT':'https://youtube.com/shorts/bhGNWPmxxjM','R/HIP-FEINT':'https://youtube.com/shorts/bhGNWPmxxjM',
  'L/OBLIQUE KICK':'https://youtube.com/shorts/n-x84-EG7YA','R/OBLIQUE KICK':'https://youtube.com/shorts/n-x84-EG7YA',
  'SWITCH STEP':'https://youtube.com/shorts/YKfWcIocCJY',
};
/** Codes appear with inconsistent spacing in the sheet ("SHOVEL  RH" with a
 *  double space, "BLOCK L" vs "L/BLOCK"). Collapse whitespace and uppercase
 *  before lookup so those don't silently miss. */
function normCode(s) { return String(s || '').trim().toUpperCase().replace(/\s+/g, ' '); }
function videoFor(code) { return VIDEO[normCode(code)] || ''; }

/* Day chips: Mon–Sat only. Sunday falls back to Saturday's kickboxing. */
const chips = DAYS.slice(1);
$('#days').innerHTML = chips.map(d =>
  `<button class="day${d === DAYS[new Date().getDay()] ? ' today' : ''}" data-day="${d}"
     aria-pressed="${d === (state.day === 'Sunday' ? 'Saturday' : state.day)}">${d.slice(0,3)}</button>`).join('');
if (state.day === 'Sunday') state.day = 'Saturday';

$('#days').addEventListener('click', e => {
  const b = e.target.closest('.day'); if (!b) return;
  state.day = b.dataset.day; load();
});
document.querySelectorAll('.tier button').forEach(b => b.addEventListener('click', () => {
  state.tier = b.id === 't-blue' ? 'BLUE' : 'BLACK';
  $('#t-blue').setAttribute('aria-pressed', state.tier === 'BLUE');
  $('#t-black').setAttribute('aria-pressed', state.tier === 'BLACK');
  renderTowers();
}));
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  $('#main').scrollTo({ left: $('#main').clientWidth * Number(t.dataset.pane), behavior: 'smooth' });
}));
$('#main').addEventListener('scroll', () => {
  const i = Math.round($('#main').scrollLeft / $('#main').clientWidth);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', Number(t.dataset.pane) === i));
});

async function load() {
  document.querySelectorAll('.day').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.day === state.day));
  $('#towers').innerHTML = '<p class="empty">Loading…</p>';
  let d;
  try {
    const r = await fetch(`/api/day?day=${state.day}`);
    d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || `Server returned ${r.status}`);
  } catch (err) {
    // Say what actually went wrong. A spinner that never resolves tells a
    // coach nothing and tells whoever's debugging even less.
    const msg = /fetch|network/i.test(err.message)
      ? 'No connection. Try again once you\'re back on wifi.'
      : err.message;
    $('#towers').innerHTML =
      `<p class="empty">Couldn't load today's programming.</p>
       <p class="empty" style="font-family:ui-monospace,monospace;font-size:12px">${esc(msg)}</p>
       <button id="retry" style="margin-top:12px;padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--white);font:600 14px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em">Try again</button>`;
    $('#retry').onclick = load;
    $('#stamp').textContent = '';
    $('#pane-workout').innerHTML = '<p class="empty">Unavailable while the sheet connection is down.</p>';
    $('#pane-news').innerHTML = '<p class="empty">Unavailable while the sheet connection is down.</p>';
    return;
  }
  state.data = d;
  renderNews();
  const synced = new Date(d.updatedAt);
  $('#stamp').innerHTML = `${esc(d.weekTitle || '')}<br>${
    isNaN(synced) ? '' : 'Synced ' + synced.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
  renderTowers(); renderWorkout();
}

function renderTowers() {
  const d = state.data; if (!d) return;
  $('#towers').innerHTML = d.towers.map(t => {
    const lines = t[state.tier] || [];
    const body = lines.length && lines.some(l => l.length)
      ? lines.map(line => line.map(tok =>
          `<button class="tok ${tok.meaning ? 'known' : ''}"${tok.meaning ? ` data-gloss="${esc(tok.meaning)}"` : ''}>${esc(tok.text)}</button>`
        ).join('') + '<i class="brk"></i>').join('')
      : '<p class="empty">Nothing programmed for this tower today.</p>';
    return `<div class="tower"><h2>${esc(t.tower)}</h2><div class="combo">${body}</div></div>`;
  }).join('');
}

/* Tapping a code drops its meaning inline — no leaving for the Notation Key.
 * If that code has a reference clip, the gloss itself becomes the link:
 * it's visually marked (brighter fill, a "Watch" tag) and a second tap
 * opens the clip in a new tab. No separate play button needed. */
$('#towers').addEventListener('click', e => {
  const linked = e.target.closest('.gloss.linked');
  if (linked) { window.open(linked.dataset.video, '_blank', 'noopener'); return; }

  const b = e.target.closest('.tok.known'); if (!b) return;
  const combo = b.closest('.combo');
  const open = combo.querySelector('.gloss');
  const same = open && open.dataset.for === b.textContent;
  if (open) open.remove();
  if (same) return;

  const video = videoFor(b.textContent);
  const g = document.createElement('div');
  g.className = 'gloss' + (video ? ' linked' : '');
  g.dataset.for = b.textContent;
  if (video) g.dataset.video = video;
  g.innerHTML = `${esc(b.textContent)} — ${esc(b.dataset.gloss)}` +
    (video ? '<span class="watch">▶ Watch</span>' : '');
  combo.appendChild(g);
});

/** Which Programming tab is live, with a Change control for schedulers only.
 *  Auto-resets to the calendar the moment an override is cleared — nothing
 *  to remember to undo. */
function monthBar(p) {
  const label = p.activeTab || 'No month tab found';
  const tag = p.overridden
    ? '<span class="tagline" style="color:var(--warn)">manual override</span>'
    : '<span class="tagline">auto · calendar</span>';

    ? `<button id="chmonth" style="margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--chalk);border-radius:7px;padding:5px 11px;font:600 11px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;cursor:pointer">Change</button>`
    : '';
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--white)">

function renderWorkout() {

function renderNews() {
  const list = (state.data && state.data.announcements) || [];

  // Banner sits on the Combos pane, because that's what's open at the start
  // of class — which is when you read the announcement out.
  const old = document.querySelector('#pane-combos .banner');
  if (old) old.remove();
  if (list.length) {
    const a = list[0];
    const b = document.createElement('div');
    b.className = 'banner';
    b.innerHTML = `<h3>${esc(a.title)}</h3><p>${esc(a.message || '')}</p>` +
      (list.length > 1 ? `<span class="more">+${list.length - 1} more in News</span>` : '');
    $('#pane-combos').insertBefore(b, $('#pane-combos').firstChild);
    b.querySelector('.more')?.addEventListener('click', () =>
      $('#main').scrollTo({ left: $('#main').clientWidth * 2, behavior: 'smooth' }));
  }

  $('#pane-news').innerHTML = list.length
    ? list.map(a => `<div class="news"><h3>${esc(a.title)}</h3>
        <div class="meta">${esc(a.posted || '')}${a.by ? ' · ' + esc(a.by) : ''}</div>
        ${a.message ? `<p>${esc(a.message)}</p>` : ''}</div>`).join('')
    : '<p class="empty">Nothing posted right now.</p>';
}

async function bootIdentity() {
  me.email = (localStorage.getItem('gauntlet-email') || '').toLowerCase().trim();

  try {

    me.name = d.me.name;
    me.canConfirm = d.canConfirm; me.canAnnounce = d.canAnnounce; me.canSchedule = d.canSchedule;

/* ---------- schedule ---------- */

const sched = { date: new Date(), slots: [], staff: [], events: [], view: 'day', week: null };
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const pretty = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

async function loadSchedule() {
  if (sched.view === 'week') return loadWeek();
  $('#pane-schedule').classList.remove('week');
  $('#pane-schedule').innerHTML = '<p class="empty">Loading…</p>';
  try {
    const r = await fetch(`/api/schedule?date=${iso(sched.date)}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    sched.slots = d.slots; sched.staff = d.staff || []; sched.events = d.events || []; sched.events = d.events || [];
  } catch (e) {
    $('#pane-schedule').innerHTML = `<p class="empty">${esc(e.message)}</p>`;
    return;
  }
  renderSchedule();
}

const viewToggle = () => `<div class="viewtog" id="viewtog">
    <button data-view="day" aria-pressed="${sched.view === 'day'}">Day</button>
    <button data-view="week" aria-pressed="${sched.view === 'week'}">Week</button>
  </div>`;

$('#pane-schedule').addEventListener('click', e => {
  const b = e.target.closest('#viewtog button'); if (!b) return;
  sched.view = b.dataset.view;
  loadSchedule();
});

async function loadWeek() {
  $('#pane-schedule').classList.add('week');
  $('#pane-schedule').innerHTML = '<p class="empty">Loading…</p>';
  try {
    const r = await fetch(`/api/week?start=${iso(sched.date)}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    sched.week = d; sched.staff = d.staff || [];
  } catch (e) {
    $('#pane-schedule').innerHTML = viewToggle() + `<p class="empty">${esc(e.message)}</p>`;
    return;
  }
  renderWeek();
}

function renderWeek() {
  const w = sched.week;
  const span = `${new Date(w.start + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${
    new Date(w.end + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  const todayIso = iso(new Date());

  // Rows are the start times that actually occur this week, not every half
  // hour — same shape as the Mariana grid without the dead space between 7am
  // and noon that makes you scroll past nothing on a phone.
  const times = [...new Set(w.days.flatMap(d =>
    [...d.slots.map(s => s.time), ...d.events.map(e => e.time).filter(Boolean)]))]
    .sort((a, b) => minutes(a) - minutes(b));

  const head = `<div class="wk-head"></div>` + w.days.map(d => {
    const dt = new Date(d.date + 'T12:00:00');
    return `<div class="wk-head ${d.date === todayIso ? 'today' : ''}">
      ${dt.toLocaleDateString('en-US',{weekday:'short'})}<b>${dt.getMonth()+1}/${dt.getDate()}</b></div>`;
  }).join('');

  const body = times.map(t => {
    const cells = w.days.map(d => {
      const slot = d.slots.find(s => s.time === t);
      const evt = d.events.find(e => e.time === t);
      let card = '';
      if (slot) card = `<div class="wk-card ${slot.cancelled ? 'off' : ''} ${slot.request ? 'ask' : ''}">
          <span class="n">${esc(slot.coach || 'Unassigned')}</span>
          ${slot.klass ? `<span class="c">${esc(slot.klass)}</span>` : ''}
          ${slot.cancelled ? `<span class="tag">${esc(slot.cancelNote)}</span>` : ''}
          ${slot.request ? '<span class="tag">needs cover</span>' : ''}
        </div>`;
      else if (evt) card = `<div class="wk-card evt">
          <span class="n">${esc(evt.title)}</span>
          ${evt.who ? `<span class="c">${esc(evt.who)}</span>` : ''}</div>`;
      return `<div class="wk-cell ${d.date === todayIso ? 'today' : ''}">${card}</div>`;
    }).join('');
    return `<div class="wk-time">${esc(t)}</div>` + cells;
  }).join('');

  // Untimed events (all-day) get listed under the grid rather than guessed at.
  const untimed = w.days.flatMap(d => d.events.filter(e => !e.time)
    .map(e => `<div class="wk-row"><span class="t">${new Date(d.date + 'T12:00:00').toLocaleDateString('en-US',{weekday:'short'})}</span>
      <span class="n">${esc(e.title)}${e.who ? ' · ' + esc(e.who) : ''}</span></div>`)).join('');

  $('#pane-schedule').innerHTML = viewToggle() + `<div class="datenav">
      <button id="prev" aria-label="Previous week">‹</button>
      <div class="label">${esc(span)}</div>
      <button id="next" aria-label="Next week">›</button>
    </div>
    <div class="wk-scroll"><div class="wk-grid" style="grid-template-columns:56px repeat(7,minmax(100px,1fr))">
      ${head}${body}
    </div></div>
    ${untimed}
    <p class="hint">Swipe the grid sideways · switch to Day to assign or swap</p>`;

  $('#prev').onclick = () => { sched.date.setDate(sched.date.getDate() - 7); loadWeek(); };
  $('#next').onclick = () => { sched.date.setDate(sched.date.getDate() + 7); loadWeek(); };
}

/** "5:15 AM" -> minutes past midnight, so rows sort by clock not by string. */
function minutes(t) {
  const m = String(t || '').match(/(\d{1,2})(?::(\d{2}))?\s*([ap])/i);
  if (!m) return 9999;
  let h = Number(m[1]) % 12;
  if (/p/i.test(m[3])) h += 12;
  return h * 60 + Number(m[2] || 0);
}

function renderSchedule() {
  const nav = viewToggle() + `<div class="datenav">
      <button id="prev" aria-label="Previous day">‹</button>
      <div class="label">${esc(pretty(sched.date))}</div>
      <button id="next" aria-label="Next day">›</button>
    </div>`;

  const events = (sched.events || []).map(e => `
    <div class="evt ${/meeting/i.test(e.kind) ? 'meeting' : ''}">
      <div class="top"><h3>${esc(e.title)}</h3><span class="tagline">${esc(e.kind)}</span></div>
      <div class="meta">${[e.time, e.location].filter(Boolean).map(esc).join(' · ')}</div>
      ${e.who ? `<div class="meta">${esc(e.who)}</div>` : ''}
      ${me.canSchedule ? `<div class="acts"><button data-act="delevent" data-row="${e.row}">Remove</button></div>` : ''}
    </div>`).join('');

  const body = sched.slots.length ? sched.slots.map(s => {
    const mine = me.name && s.coach === me.name;
    const req = s.request;
    const acts = [];
    // Your own shift: hand it off. Someone else's open shift: take it.
    if (mine && !req) acts.push(`<button data-act="cover" data-row="${s.row}">Need cover</button>`,
                                `<button data-act="trade" data-row="${s.row}">Ask a trade</button>`);
    if (req && req.from !== me.name) acts.push(`<button class="take" data-act="take" data-req="${req.row}">Take it</button>`);
    if (me.canSchedule) acts.push(
      `<button data-act="assign" data-row="${s.row}">Assign</button>`,
      `<button data-act="edit" data-row="${s.row}">Edit</button>`,
      `<button data-act="del" data-row="${s.row}">Delete</button>`);

    return `<div class="slot ${req ? 'open' : ''} ${s.closed ? 'closed' : ''}"
        data-time="${esc(s.time)}" data-class="${esc(s.klass)}" data-day="${esc(s.day)}" data-coach="${esc(s.coach)}">
      <div class="top"><span class="when">${esc(s.time)}</span><span class="cls">${esc(s.klass || '')}</span></div>
      <div class="who ${s.coach ? '' : 'none'}">${esc(s.coach || 'Unassigned')}${s.covered ? ' · covering' : ''}</div>
      ${s.closed ? `<div class="ask">${esc(s.closed)}</div>` : ''}
      ${req ? `<div class="ask"><strong>${esc(req.from)}</strong> needs ${req.type.toLowerCase() === 'trade' ? `a trade${req.to ? ' with ' + esc(req.to) : ''}` : 'cover'}${req.note ? ' — ' + esc(req.note) : ''}</div>` : ''}
      ${acts.length ? `<div class="acts">${acts.join('')}</div>` : ''}
    </div>`;
  }).join('') : '<p class="empty">No classes scheduled this day.</p>';

  const add = me.canSchedule
    ? `<button id="addslot" style="width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--chalk);font:600 13px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;cursor:pointer">+ Add class slot</button>`
    : '';

  const addEvt = me.canSchedule
    ? `<button id="addevent" style="width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--chalk);font:600 13px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;cursor:pointer">+ Add event or closure</button>`
    : '';
  $('#pane-schedule').innerHTML = nav + events + body + add + addEvt;
  if ($('#addevent')) $('#addevent').onclick = addEvent;
  $('#prev').onclick = () => { sched.date.setDate(sched.date.getDate() - 1); loadSchedule(); };
  $('#next').onclick = () => { sched.date.setDate(sched.date.getDate() + 1); loadSchedule(); };
  if ($('#addslot')) $('#addslot').onclick = addSlot;
}

$('#pane-schedule').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const slotEl = b.closest('.slot');
  const slot = slotEl && { time: slotEl.dataset.time, klass: slotEl.dataset.class };

  if (b.dataset.act === 'take') {
    b.disabled = true; b.textContent = '…';
    await post('/api/swap/accept', { email: me.email, row: Number(b.dataset.req) });
    return loadSchedule();
  }
  if (b.dataset.act === 'assign') return assignSlot(Number(b.dataset.row), slot);
  if (b.dataset.act === 'edit') return editSlot(Number(b.dataset.row), slotEl.dataset);
  if (b.dataset.act === 'del') return confirmDelete(Number(b.dataset.row), slotEl.dataset);
  if (b.dataset.act === 'delevent') {
    await post('/api/events/delete', { email: me.email, row: Number(b.dataset.row) });
    return loadSchedule();
  }
  askSwap(b.dataset.act, slot);
});

async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const d = await r.json();
  if (!r.ok) { alert(d.error); throw new Error(d.error); }
  return d;
}

function askSwap(type, slot) {
  $('#dlg').showModal();
  $('#sheet').innerHTML = `
    <h2>${type === 'trade' ? 'Ask a trade' : 'Need cover'}</h2>
    <p class="sub">${esc(slot.time)} · ${esc(slot.klass)} · ${esc(pretty(sched.date))}</p>
    ${type === 'trade' ? `<p class="sub">Who are you asking?</p>
      <div class="pick" id="pick">${sched.staff.filter(n => n !== me.name)
        .map(n => `<button data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
    <textarea id="note" placeholder="Anything they should know?"></textarea>
    <footer style="position:static;padding:0;gap:8px;background:none">
      <button onclick="dlg.close()">Cancel</button>
      <button class="primary" id="go">Send request</button>
    </footer><div class="err" id="err"></div>`;

  let target = '';
  if ($('#pick')) $('#pick').onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    target = b.dataset.name;
    $('#pick').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  };

  $('#go').onclick = async () => {
    $('#go').disabled = true; $('#go').textContent = 'Sending…';
    try {
      await post('/api/swap', {
        email: me.email, date: iso(sched.date), time: slot.time, klass: slot.klass,
        type, target, note: $('#note').value,
      });
      $('#dlg').close(); loadSchedule();
    } catch { $('#go').disabled = false; $('#go').textContent = 'Send request'; }
  };
}

function assignSlot(row, slot) {
  $('#dlg').showModal();
  $('#sheet').innerHTML = `
    <h2>Assign coach</h2>
    <p class="sub">${esc(slot.time)} · ${esc(slot.klass)} · every ${esc(pretty(sched.date).split(',')[0])}</p>
    <div class="pick" id="pick">
      ${sched.staff.map(n => `<button data-name="${esc(n)}">${esc(n)}</button>`).join('')}
      <button data-name="">Unassign</button>
    </div>
    <div class="err" id="err"></div>`;
  $('#pick').onclick = async ev => {
    const b = ev.target.closest('button'); if (!b) return;
    try {
      await post('/api/schedule/assign', { email: me.email, row, coach: b.dataset.name });
      $('#dlg').close(); loadSchedule();
    } catch {}
  };
}

function dayPicker(selected) {
  return `<div class="pick" id="days">${DAYS.slice(1).map(d =>
    `<button data-day="${d}"${d === selected ? ' aria-pressed="true"' : ''}>${d.slice(0,3)}</button>`).join('')}</div>`;
}
function wireDays(initial, set) {
  let v = initial;
  $('#days').onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    v = b.dataset.day; set(v);
    $('#days').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  };
  return () => v;
}

function editSlot(row, d) {
  $('#dlg').showModal();
  $('#sheet').innerHTML = `
    <h2>Edit slot</h2>
    <p class="sub">Changing this changes it every week.</p>
    ${dayPicker(d.day)}
    <input type="text" id="time" placeholder="time" value="${esc(d.time)}">
    <input type="text" id="klass" placeholder="label (optional) — e.g. Fire, Kickboxing" value="${esc(d.class)}">
    <footer style="position:static;padding:0;gap:8px;background:none">
      <button onclick="dlg.close()">Cancel</button>
      <button class="primary" id="go">Save</button>
    </footer><div class="err" id="err"></div>`;
  const getDay = wireDays(d.day, () => {});
  $('#go').onclick = async () => {
    try {
      await post('/api/schedule/slot/update', {
        email: me.email, row, day: getDay(),
        time: $('#time').value.trim(), klass: $('#klass').value.trim(), coach: d.coach,
      });
      $('#dlg').close(); loadSchedule();
    } catch {}
  };
}

/** Deleting removes the slot from every week, so it asks first. */
function confirmDelete(row, d) {
  $('#dlg').showModal();
  $('#sheet').innerHTML = `
    <h2>Delete this slot?</h2>
    <p class="sub">${esc(d.day)} · ${esc(d.time)}${d.class ? ' · ' + esc(d.class) : ''}${d.coach ? ' · ' + esc(d.coach) : ''}</p>
    <p class="sub">It disappears from every week, not just this date. To cancel one day only, add a closure instead.</p>
    <footer style="position:static;padding:0;gap:8px;background:none">
      <button onclick="dlg.close()">Keep it</button>
      <button class="primary" id="go" style="background:var(--warn);border-color:var(--warn);color:#1a1200">Delete</button>
    </footer><div class="err" id="err"></div>`;
  $('#go').onclick = async () => {
    try { await post('/api/schedule/slot/delete', { email: me.email, row }); $('#dlg').close(); loadSchedule(); }
    catch {}
  };
}

/** One-offs: an off-site event, an admin meeting, or a cancelled class. */
function addEvent() {
  $('#dlg').showModal();
  $('#sheet').innerHTML = `
    <h2>Add to ${esc(pretty(sched.date))}</h2>
    <div class="pick" id="kind">
      <button data-kind="Event" aria-pressed="true">Event</button>
      <button data-kind="Meeting">Meeting</button>
      <button data-kind="Closed">Class cancelled</button>
    </div>
    <input type="text" id="title" placeholder="name — e.g. Fitfest, Admin meeting, No noon class">
    <input type="text" id="time" placeholder="time (optional — blank cancels the whole day)">
    <input type="text" id="loc" placeholder="where (optional)">
    <p class="sub" id="wholbl">Who's working it?</p>
    <div class="pick" id="who">${sched.staff.map(n => `<button data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <footer style="position:static;padding:0;gap:8px;background:none">
      <button onclick="dlg.close()">Cancel</button>
      <button class="primary" id="go">Add</button>
    </footer><div class="err" id="err"></div>`;

  let kind = 'Event';
  const who = new Set();
  $('#kind').onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    kind = b.dataset.kind;
    $('#kind').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    const hide = kind === 'Closed';                 // nobody staffs a cancellation
    $('#who').style.display = hide ? 'none' : '';
    $('#wholbl').style.display = hide ? 'none' : '';
  };
  // Events can have several people on them — Paul and Mason assisting, say.
  $('#who').onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const n = b.dataset.name;
    who.has(n) ? who.delete(n) : who.add(n);
    b.setAttribute('aria-pressed', who.has(n));
  };

  $('#go').onclick = async () => {
    try {
      await post('/api/events', {
        email: me.email, date: iso(sched.date), kind,
        title: $('#title').value.trim(), time: $('#time').value.trim(),
        location: $('#loc').value.trim(), who: [...who],
      });
      $('#dlg').close(); loadSchedule();
    } catch {}
  };
}

/** Retime, relabel, or delete a standing slot. Delete is permanent — the
 *  "just this week" version is the No class button on the slot itself. */
function editSlot(row, slot) {
  const cur = sched.slots.find(s => s.row === row) || {};
  $('#dlg').showModal();
  $('#sheet').innerHTML = `
    <h2>Edit slot</h2>
    <p class="sub">Changes every ${esc(pretty(sched.date).split(',')[0])}, not just this week.</p>
    <input type="text" id="e-time" placeholder="time" value="${esc(cur.time || '')}">
    <input type="text" id="e-class" placeholder="class (optional)" value="${esc(cur.klass || '')}">
    <input type="text" id="e-assist" placeholder="assisting (optional)" value="${esc(cur.assisting || '')}">
    <footer style="position:static;padding:0;gap:8px;background:none">
      <button id="e-del" style="color:var(--warn)">Delete</button>
      <button class="primary" id="e-save">Save</button>
    </footer><div class="err" id="err"></div>`;

  $('#e-save').onclick = async () => {
    try {
      await post('/api/schedule/slot/update', {
        email: me.email, row, day: cur.day, time: $('#e-time').value.trim(),
        klass: $('#e-class').value.trim(), coach: cur.coach, assisting: $('#e-assist').value.trim(),
      });
      $('#dlg').close(); loadSchedule();
    } catch {}
  };
  $('#e-del').onclick = async () => {
    if (!confirm('Delete this slot from every week? Use "No class" if you only mean this week.')) return;
    try {
      await post('/api/schedule/slot/delete', { email: me.email, row });
      $('#dlg').close(); loadSchedule();
    } catch {}
  };
}

/* ---------- confirm week (Kendall + Ivan) ---------- */


$('#btn-confirm').addEventListener('click', openConfirm);
async function openConfirm() {
  $('#dlg').showModal();
  $('#sheet').innerHTML = '<p class="sub">Loading the week…</p>';
  const r = await fetch('/api/week/review');
  const d = await r.json();
  $('#sheet').innerHTML = `
    <h2>Confirm ${esc(d.weekLabel || '')}</h2>
    <p class="sub">This is exactly what coaches will see Monday through Friday.</p>
    ${d.days.map(x => `<div class="rev ${x.empty ? 'bad' : ''}">
      <h4>${x.day}${x.empty ? ' — empty' : ''}</h4>
      <p>${esc(x.empty ? 'No workout written yet.' : x.main)}</p></div>`).join('')}
    <input type="email" id="who" placeholder="your email" value="${esc(identity())}">
    <footer style="position:static;padding:0;gap:8px;background:none">
      <button onclick="dlg.close()">Cancel</button>
      <button class="primary" id="go">Confirm week</button>
    </footer><div class="err" id="err"></div>`;
  $('#go').onclick = () => send(false);
}
async function send(force) {
  const email = $('#who').value.trim().toLowerCase();
  localStorage.setItem('gauntlet-email', email);
  const r = await fetch('/api/week/confirm', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, force }),
  });
  const d = await r.json();
  if (r.ok) { $('#dlg').close(); load(); return; }
  if (d.error === 'empty_days') {
    $('#err').innerHTML = `${d.days.join(', ')} ${d.days.length > 1 ? 'have' : 'has'} no workout.
      <button class="primary" id="force" style="margin-top:8px">Confirm anyway</button>`;
    $('#force').onclick = () => send(true);
  } else $('#err').textContent = d.error;
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

(async () => {
  await bootIdentity();   // permissions decide what the schedule pane offers
  load();
  loadSchedule();
})();
